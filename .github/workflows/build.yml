name: Build Windows app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Version
        shell: pwsh
        run: Set-Content -Path rt/_version.py -Value "BUILD = ${{ github.run_number }}"
      - name: Fonts
        run: python -m rt fonts
      - name: Inpainting model (LaMa, OpenCV Zoo, checksum-verified)
        run: python -c "from rt import lama; print(lama.fetch('models'))"
      - name: FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          New-Item -ItemType Directory -Force bin | Out-Null
          Get-ChildItem ff -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination bin
      - name: Self test (engine on a generated clip)
        shell: pwsh
        run: |
          $env:FFMPEG="$PWD\bin\ffmpeg.exe"; $env:FFPROBE="$PWD\bin\ffprobe.exe"
          python tests/selftest.py
      - name: Package
        run: >
          pyinstaller --noconfirm --windowed --name Retitle --icon assets/icon.ico
          --add-data "rt/ui;rt/ui" --add-data "fonts;fonts" --add-data "models;models" --add-binary "bin/ffmpeg.exe;bin" --add-binary "bin/ffprobe.exe;bin"
          --collect-all rapidocr_onnxruntime --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime
          --collect-all webview --hidden-import clr --collect-submodules rt --hidden-import tkinter
          retitle_app.py
      - name: Exe smoke test (engine through the API)
        shell: pwsh
        run: ./tests/exe_smoke.ps1
      - name: Exe smoke test (window mode starts)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Retitle\Retitle.exe" -PassThru
          Start-Sleep 20
          if ($p.HasExited) { Get-Content "$env:APPDATA\Retitle\retitle.log" -ErrorAction SilentlyContinue; throw "app exited" }
          Invoke-RestMethod "http://127.0.0.1:8765/api/status" | Out-Null
          Get-Content "$env:APPDATA\Retitle\retitle.log" -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force
          Write-Host "WINDOW SMOKE OK"
      - name: Zip
        shell: pwsh
        run: Compress-Archive dist/Retitle Retitle-win64.zip
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DAppVer=${{ github.run_number }} installer.iss
          Copy-Item dist/Retitle-Setup.exe Retitle-Setup.exe
      - name: Installer smoke test (silent install, start, uninstall)
        shell: pwsh
        run: |
          $p = Start-Process .\Retitle-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -PassThru
          $p.WaitForExit()
          $exe = "$env:LOCALAPPDATA\Programs\Retitle\Retitle.exe"
          if (!(Test-Path $exe)) { throw "not installed" }
          Start-Sleep 15
          Invoke-RestMethod "http://127.0.0.1:8765/api/status" | Out-Null
          Get-Process Retitle -ErrorAction SilentlyContinue | Stop-Process -Force
          $u = Start-Process "$env:LOCALAPPDATA\Programs\Retitle\unins000.exe" -ArgumentList "/VERYSILENT" -PassThru
          $u.WaitForExit()
          Write-Host "INSTALLER SMOKE OK"
      - uses: actions/upload-artifact@v4
        with:
          name: Retitle-win64
          path: |
            Retitle-Setup.exe
            Retitle-win64.zip
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Retitle build ${{ github.run_number }}
          files: |
            Retitle-Setup.exe
            Retitle-win64.zip
          make_latest: true
      - name: Publish to the public releases repo (for installs without a token)
        if: ${{ env.RELEASES_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: Elior-sasi/retitle-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: build-${{ github.run_number }}
          name: Retitle build ${{ github.run_number }}
          files: |
            Retitle-Setup.exe
            Retitle-win64.zip
          make_latest: true
